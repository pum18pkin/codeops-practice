<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Budget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Birr Budget</h1>
            <p class="tagline">Your Personal Finance Tracker</p>
        </div>
    </header>

    <main class="container">
        <section class="dashboard">
            <div class="card card-income">
                <h2>Total Income</h2>
                <p class="amount" id="total-income">ETB 0.00</p>
            </div>
            <div class="card card-expense">
                <h2>Total Expenses</h2>
                <p class="amount" id="total-expenses">ETB 0.00</p>
            </div>
            <div class="card card-balance">
                <h2>Current Balance</h2>
                <p class="amount" id="current-balance">ETB 0.00</p>
            </div>
        </section>
        <section class="form-section">
            <h2 class="section-title">Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="">-- Select Type --</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly Salary" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (ETB)</label>
                        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">-- Select Category --</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Business">Business</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Housing">Housing</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </section>
        <section class="history-section">
            <h2 class="section-title">Transaction History</h2>
            <div class="history-table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                    </tbody>
                </table>
                <p class="empty-message" id="empty-message">No transactions yet. Add one above!</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Birr Budget. Manage your money wisely.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
